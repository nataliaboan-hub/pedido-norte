<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bierlife — Pedido de botellas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7DBBE;
    --paper-light:#F1E8D2;
    --ink:#241B12;
    --ink-soft:#5B4E3B;
    --bottle:#1D3B2D;
    --bottle-light:#2C4F3B;
    --copper:#A85C2E;
    --copper-dark:#8A4620;
    --hop:#6B7F4B;
    --line:rgba(36,27,18,0.18);
    --whatsapp:#2E7D4F;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.15), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,0.05), transparent 45%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.4;
    padding-bottom:100px;
  }

  .page{
    max-width:880px;
    margin:0 auto;
    padding:0 20px;
  }

  /* ---------- Header / label banner ---------- */
  .label-banner{
    background:var(--bottle);
    background-image:linear-gradient(135deg, var(--bottle) 0%, var(--bottle-light) 100%);
    margin:0 -20px 32px -20px;
    padding:38px 20px 44px 20px;
    text-align:center;
    position:relative;
    border-bottom:6px solid var(--copper);
  }
  .label-banner::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:6px;
  }
  .logo-img{
    width:120px;
    height:120px;
    border-radius:50%;
    display:block;
    margin:0 auto 14px auto;
    box-shadow:0 3px 0 rgba(0,0,0,0.25);
    background:var(--paper-light);
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .label-banner h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:clamp(28px, 5vw, 42px);
    color:var(--paper-light);
    margin:0 0 6px 0;
  }
  .label-banner p{
    font-family:'JetBrains Mono', monospace;
    color:var(--copper);
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin:0;
  }

  /* ---------- Section headers ---------- */
  h2.section-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:20px;
    color:var(--bottle);
    margin:0 0 4px 0;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  h2.section-title .num{
    font-family:'JetBrains Mono', monospace;
    color:var(--copper);
    font-size:14px;
  }
  .rule{
    height:1px;
    background:var(--line);
    margin:12px 0 24px 0;
  }
  section{margin-bottom:36px;}

  /* ---------- Form ---------- */
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 20px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
  }
  label .req{color:var(--copper);}
  input[type=text], input[type=tel], input[type=email], textarea{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:11px 12px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus, textarea:focus{
    outline:2px solid var(--copper);
    outline-offset:1px;
  }
  textarea{resize:vertical; min-height:70px;}

  .radio-toggle{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:4px;
  }
  .radio-toggle label{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 14px;
    cursor:pointer;
    text-transform:none;
    font-weight:500;
    font-size:14px;
    color:var(--ink);
    flex:1;
    min-width:160px;
  }
  .radio-toggle input{accent-color:var(--copper);}

  /* ---------- Product table ---------- */
  table.products{
    width:100%;
    border-collapse:collapse;
    background:var(--paper-light);
  }
  table.products thead th{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--paper-light);
    background:var(--bottle);
    text-align:left;
    padding:11px 14px;
  }
  table.products thead th.num-col{text-align:center;}
  table.products tbody td{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  table.products tbody tr:last-child td{border-bottom:none;}
  .prod-name{font-weight:600;}
  .prod-style{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
  }
  .price-cell{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    white-space:nowrap;
  }
  .prod-price-inline{display:none;}

  .stock-label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--copper-dark);
    margin-top:2px;
  }
  tr.agotado{opacity:0.55;}
  .qty-btn:disabled, .qty-input:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .qty-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .qty-btn{
    width:28px; height:28px;
    border:1px solid var(--copper);
    background:var(--paper-light);
    color:var(--copper);
    border-radius:3px;
    font-size:16px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-btn:hover{background:var(--copper); color:var(--paper-light);}
  .qty-input{
    width:42px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    border:1px solid var(--line);
    border-radius:3px;
    padding:5px 2px;
    background:#fff;
  }

  /* ---------- Caja personalizada ---------- */
  .custom-box-help{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 20px 0;
    line-height:1.5;
  }
  .custom-box-widget{
    background:var(--paper-light);
    border-radius:4px;
    padding:18px;
    margin-bottom:18px;
  }
  .custom-box-title{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:15px;
    color:var(--bottle);
    margin:0 0 12px 0;
  }
  .custom-box-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .custom-select{
    flex:1;
    min-width:160px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .custom-qty-picker{
    width:64px;
    padding:9px 8px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    font-family:'JetBrains Mono', monospace;
    text-align:center;
  }
  .custom-add-btn{
    background:var(--copper);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:3px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .custom-add-btn:hover{filter:brightness(1.08);}
  .custom-empty{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    margin:6px 0;
  }
  .custom-item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .custom-item-row:last-child{border-bottom:none;}
  .custom-item-name{font-weight:600; flex:1;}
  .custom-item-price{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .custom-progress{
    font-size:13px;
    font-weight:600;
    margin:12px 0 0 0;
  }
  .custom-progress.warn{color:var(--copper-dark);}
  .custom-progress.ok{color:var(--hop);}

  @media (max-width:640px){
    .custom-box-form{flex-direction:column;}
    .custom-select, .custom-qty-picker, .custom-add-btn{width:100%;}
  }

  /* mobile card layout for table */
  @media (max-width:640px){
    table.products thead{display:none;}
    table.products, table.products tbody, table.products tr, table.products td{
      display:block;
      width:100%;
    }
    table.products tr{
      border:1px solid var(--line);
      border-radius:4px;
      margin-bottom:10px;
      padding:10px 12px;
    }
    table.products td{
      border:none;
      padding:6px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    table.products td::before{
      content:attr(data-label);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.05em;
      color:var(--ink-soft);
      font-weight:600;
    }
    table.products td.prod-cell{
      flex-direction:column;
      align-items:flex-start;
      gap:3px;
    }
    table.products td.price-cell{
      display:none;
    }
    .prod-name{
      display:flex;
      align-items:baseline;
      gap:8px;
    }
    .prod-price-inline{
      display:inline;
      font-family:'JetBrains Mono', monospace;
      font-weight:700;
      font-size:14px;
      color:var(--bottle);
    }
    .form-grid{grid-template-columns:1fr;}
  }

  /* ---------- Sticky total bar ---------- */
  .total-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--bottle);
    border-top:4px solid var(--copper);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    flex-wrap:wrap;
    z-index:10;
  }
  .total-info{
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--paper-light);
  }
  .total-info .label{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:13px;
  }
  .total-info .amount{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:24px;
    color:var(--copper);
  }
  .send-btn{
    background:var(--whatsapp);
    color:#fff;
    border:none;
    padding:13px 22px;
    border-radius:4px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .send-btn:hover{filter:brightness(1.08);}
  .send-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .send-btn svg{width:18px;height:18px;fill:#fff;}

  /* ---------- Aviso centrado (éxito / error) ---------- */
  .toast-overlay{
    position:fixed;
    inset:0;
    background:rgba(36,27,18,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }
  .toast-overlay.show{display:flex;}
  .toast-box{
    background:var(--paper-light);
    border-radius:6px;
    border-top:4px solid var(--hop);
    padding:28px 24px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .toast-box.error{border-top-color:var(--copper-dark);}
  .toast-box p{
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    margin:0 0 20px 0;
  }
  .toast-close-btn{
    background:var(--bottle);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:4px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toast-close-btn:hover{filter:brightness(1.15);}
</style>
</head>
<body>

<div class="page">

  <header class="label-banner">
    <img src="logo-bierlife.jpg" alt="Bierlife" class="logo-img">
    <h1 class="sr-only">Bierlife</h1>
    <p>Hacé tu pedido de cerveza artesanal</p>
  </header>

  <!-- ===================== DATOS DEL CLIENTE ===================== -->
  <section>
    <h2 class="section-title"><span class="num">01</span> Tus datos</h2>
    <div class="rule"></div>
    <div class="form-grid">
      <div class="field">
        <label>Nombre <span class="req">*</span></label>
        <input type="text" id="f-nombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="field">
        <label>Teléfono <span class="req">*</span></label>
        <input type="tel" id="f-telefono" placeholder="Ej: 11 2345 6789">
      </div>
    </div>
  </section>

  <!-- ===================== PRODUCTOS (dinámico según la planilla) ===================== -->
  <div id="products-container">
    <p id="loading-msg" style="text-align:center; color:var(--ink-soft); padding:20px 0;">Cargando productos…</p>
  </div>

</div>

<div class="total-bar">
  <div class="total-info">
    <span class="label">Total del pedido</span>
    <span class="amount" id="total-amount">$0</span>
  </div>
  <button class="send-btn" id="send-btn">
    <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.3-1.4-.8-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5C11 9 10.5 7.7 10.3 7.2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.5 1.1 2.7c.1.2 2 3 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.5-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.6 1.4 5.1L2 22l5-1.3c1.4.8 3.1 1.2 4.9 1.2h.1c5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2h-.1c-1.6 0-3.2-.4-4.5-1.2l-.3-.2-3.3.9.9-3.2-.2-.3c-.9-1.4-1.4-3-1.4-4.7C3.1 6.9 7 3.1 12 3.1c2.4 0 4.7.9 6.4 2.7 1.7 1.7 2.7 4 2.7 6.4-.1 5-4 8.6-9.1 8.6z"/></svg>
    Enviar pedido por WhatsApp
  </button>
</div>

<div class="toast-overlay" id="order-toast">
  <div class="toast-box" id="order-toast-box">
    <p id="order-toast-text"></p>
    <button type="button" id="order-toast-close" class="toast-close-btn">Cerrar</button>
  </div>
</div>

<script>
  // ============ CONFIGURACIÓN ============
  // Link de "Publicar en la Web" (formato CSV) de la planilla con el catálogo completo.
  // La planilla debe tener las columnas: id, nombre, estilo, tamaño, precio, stock, activo
  const CATALOG_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyPcW6__Y83Y2VEMh4oDIc8lcBviixjQGTKzlr3tDNG9_lA_Ju-opzToKmxuaTlyK3vBKNRMrFpqHR/pub?gid=561970596&single=true&output=csv";

  // Orden fijo en el que aparecen las secciones si esos tamaños existen en la planilla.
  // Cualquier tamaño nuevo que agreguen (ej: "Barril") aparece solo, al final.
  const SIZE_ORDER = ["500ml", "1L", "Lata"];
  const SIZE_LABELS = {
    "500ml": "Caja de 12 botellas de 500ml",
    "1L": "Caja de 12 botellas de 1L",
    "Lata": "Caja de 12 latas",
    "Merch": "Merchandising",
  };
  // Tamaños que se venden por caja cerrada de 12 unidades (no por botella/lata suelta)
  const BOXABLE_SIZES = ["500ml", "1L", "Lata"];
  const UNITS_PER_BOX = 12;
  function isBoxable(size){ return BOXABLE_SIZES.includes(size); }
  // Nombres cortos para usar en frases tipo "Caja personalizada — {size}"
  const SIZE_SHORT_LABELS = { "500ml": "500ml", "1L": "1L", "Lata": "latas" };
  function shortSizeLabel(size){ return SIZE_SHORT_LABELS[size] || size; }

  // URL del Apps Script (termina en /exec) que guarda cada pedido en la planilla de historial
  const ORDERS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvfouO_-NGBDynGwjX_hRDzLQZkfNNwFd1VjCicorW8sAXXpcjKlrfKZAtAWgmfIq9/exec";

  function logOrder(nombre, telefono, items, total){
    if(ORDERS_SCRIPT_URL.includes("PEGAR_ACA")) return; // todavía no configurado
    const payload = {
      fecha: new Date().toISOString(),
      pedidoId: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      nombre, telefono, items, total,
    };
    fetch(ORDERS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(payload),
    }).catch(err => console.warn("No se pudo registrar el pedido en el historial:", err));
  }

  const fmt = n => "$" + n.toLocaleString("es-AR");

  function parsePrice(raw){
    if(raw === undefined || raw === null) return 0;
    let s = raw.toString().trim().replace(/[^\d.,-]/g, "");
    if(s === "") return 0;
    if(s.includes(".") && s.includes(",")){
      // formato "4.200,50" -> punto de miles, coma decimal
      s = s.replace(/\./g, "").replace(",", ".");
    } else if(s.includes(",") && !s.includes(".")){
      // formato "4200,50" -> coma decimal
      s = s.replace(",", ".");
    } else if(s.includes(".")){
      const parts = s.split(".");
      // "4.200" (grupo de 3 dígitos) se interpreta como separador de miles
      if(parts.length > 1 && parts[parts.length - 1].length === 3){
        s = s.replace(/\./g, "");
      }
    }
    const num = parseFloat(s);
    return isNaN(num) ? 0 : Math.round(num);
  }

  // ---------- Parser de CSV (soporta campos entre comillas con comas adentro) ----------
  function parseCSV(text){
    const rows = [];
    let field = "", row = [], inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"' && text[i+1] === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\r'){ /* ignorar */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ""));
  }

  function rowsToObjects(rows){
    const headers = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    });
  }

  let PRODUCTS = [];
  let PRODUCTS_BY_SIZE = [];
  const customBoxData = {}; // id -> cantidad de botellas elegidas en la caja personalizada

  // ---------- Límites de stock (compartido entre caja de sabor único y caja personalizada) ----------
  function maxBoxesFor(p){
    // Máximo de CAJAS que se pueden pedir de este sabor, restando lo ya reservado en la caja personalizada
    if(p.stock === undefined) return Infinity;
    const reservedByCustom = customBoxData[p.id] || 0;
    return Math.max(0, Math.floor((p.stock - reservedByCustom) / UNITS_PER_BOX));
  }

  function maxCustomAllowed(p){
    // Máximo de BOTELLAS que se pueden asignar a este sabor en la caja personalizada,
    // restando lo ya reservado en cajas de sabor único
    if(p.stock === undefined) return Infinity;
    const reservedByBoxes = isBoxable(p.size) ? getQty(p.id) * UNITS_PER_BOX : 0;
    return Math.max(0, p.stock - reservedByBoxes);
  }

  function clampToStock(id, qty){
    const p = PRODUCTS.find(x => x.id === id);
    if(!p || p.stock === undefined) return Math.max(0, qty);
    const maxAllowed = isBoxable(p.size) ? maxBoxesFor(p) : p.stock;
    return Math.min(Math.max(0, qty), maxAllowed);
  }

  function getQty(id){
    const el = document.getElementById(`qty-${id}`);
    if(!el) return 0;
    const v = parseInt(el.value, 10);
    return isNaN(v) || v < 0 ? 0 : v;
  }

  function displayPrice(p){
    return isBoxable(p.size) ? p.price * UNITS_PER_BOX : p.price;
  }

  function recalc(){
    let total = 0;
    PRODUCTS.forEach(p => {
      const qty = getQty(p.id);
      total += isBoxable(p.size) ? qty * p.price * UNITS_PER_BOX : qty * p.price;
    });
    Object.keys(customBoxData).forEach(id => {
      const qty = customBoxData[id];
      if(!qty) return;
      const p = PRODUCTS.find(x => x.id === id);
      if(p) total += qty * p.price;
    });
    document.getElementById("total-amount").textContent = fmt(total);
    return total;
  }

  function applyStockToRow(p){
    const row = document.getElementById(`row-${p.id}`);
    const qtyInput = document.getElementById(`qty-${p.id}`);
    const stockLabel = document.getElementById(`stock-${p.id}`);
    if(!row || !qtyInput) return;
    const btns = row.querySelectorAll(".qty-btn");

    if(p.stock === undefined){
      qtyInput.disabled = false;
      btns.forEach(b => b.disabled = false);
      row.classList.remove("agotado");
      if(stockLabel) stockLabel.textContent = "";
      return;
    }

    const maxAllowed = isBoxable(p.size) ? maxBoxesFor(p) : p.stock;

    if(maxAllowed <= 0){
      qtyInput.value = 0;
      qtyInput.disabled = true;
      btns.forEach(b => b.disabled = true);
      row.classList.add("agotado");
      if(stockLabel) stockLabel.textContent = "Agotado";
    } else {
      qtyInput.disabled = false;
      btns.forEach(b => b.disabled = false);
      row.classList.remove("agotado");
      if(stockLabel) stockLabel.textContent = "";
      qtyInput.value = clampToStock(p.id, getQty(p.id));
    }
  }

  function renderProductRow(p, tbody, boxable){
    const tr = document.createElement("tr");
    tr.id = `row-${p.id}`;
    const priceToShow = displayPrice(p);
    tr.innerHTML = `
      <td data-label="Producto" class="prod-cell">
        <span class="prod-name">${p.name}<span class="prod-price-inline">${fmt(priceToShow)}</span></span>
        ${p.style ? `<span class="prod-style">${p.style}</span>` : ""}
      </td>
      <td data-label="${boxable ? 'Precio por caja' : 'Precio'}" class="price-cell">
        ${fmt(priceToShow)}
        <span class="stock-label" id="stock-${p.id}"></span>
      </td>
      <td data-label="${boxable ? 'Cantidad de cajas' : 'Cantidad'}">
        <div class="qty-control">
          <button type="button" class="qty-btn" data-action="minus" data-id="${p.id}">−</button>
          <input type="text" inputmode="numeric" class="qty-input" id="qty-${p.id}" value="0" data-id="${p.id}">
          <button type="button" class="qty-btn" data-action="plus" data-id="${p.id}">+</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  }

  function renderProductSection(group, num, container, boxable){
    const section = document.createElement("section");
    const label = SIZE_LABELS[group.size] || group.size;
    const numStr = String(num).padStart(2, "0");
    const prodHeader = "Producto";
    const priceHeader = boxable ? "Precio por caja" : "Precio";
    const qtyHeader = boxable ? "Cantidad de cajas" : "Cantidad";
    section.innerHTML = `
      <h2 class="section-title"><span class="num">${numStr}</span> ${label}</h2>
      <div class="rule"></div>
      <table class="products">
        <thead>
          <tr>
            <th>${prodHeader}</th>
            <th class="num-col">${priceHeader}</th>
            <th class="num-col">${qtyHeader}</th>
          </tr>
        </thead>
        <tbody id="rows-${group.size}"></tbody>
      </table>
    `;
    container.appendChild(section);
    const tbody = section.querySelector(`#rows-${group.size}`);
    group.items.forEach(p => renderProductRow(p, tbody, boxable));

    tbody.addEventListener("click", e => {
      const btn = e.target.closest(".qty-btn");
      if(!btn) return;
      const id = btn.dataset.id;
      const input = document.getElementById(`qty-${id}`);
      let v = getQty(id);
      v = btn.dataset.action === "plus" ? v + 1 : Math.max(0, v - 1);
      v = clampToStock(id, v);
      input.value = v;
      recalc();
    });

    tbody.addEventListener("input", e => {
      if(e.target.classList.contains("qty-input")){
        const id = e.target.dataset.id;
        e.target.value = clampToStock(id, getQty(id));
        recalc();
      }
    });
  }

  // ---------- Caja personalizada ----------
  function renderCustomList(size){
    const container = document.getElementById(`customlist-${size}`);
    if(!container) return;
    const items = PRODUCTS.filter(p => p.size === size && (customBoxData[p.id] || 0) > 0);
    if(items.length === 0){
      container.innerHTML = `<p class="custom-empty">Todavía no agregaste ningún sabor.</p>`;
      return;
    }
    container.innerHTML = items.map(p => `
      <div class="custom-item-row">
        <span class="custom-item-name">${p.name}</span>
        <span class="custom-item-price">${fmt(p.price)}</span>
        <div class="qty-control">
          <button type="button" class="qty-btn" data-action="minus" data-id="${p.id}">−</button>
          <input type="text" inputmode="numeric" class="qty-input custom-qty-input-row" data-id="${p.id}" value="${customBoxData[p.id]}">
          <button type="button" class="qty-btn" data-action="plus" data-id="${p.id}">+</button>
        </div>
      </div>
    `).join("");
  }

  function updateCustomProgress(size){
    const el = document.getElementById(`customprogress-${size}`);
    if(!el) return;
    const total = PRODUCTS.filter(p => p.size === size).reduce((sum, p) => sum + (customBoxData[p.id] || 0), 0);
    if(total === 0){
      el.textContent = "";
      el.className = "custom-progress";
      return;
    }
    const rem = total % UNITS_PER_BOX;
    if(rem === 0){
      el.textContent = `✅ Caja completa — ${total} botellas`;
      el.className = "custom-progress ok";
    } else {
      const falta = UNITS_PER_BOX - rem;
      el.textContent = `Te faltan ${falta} botellas para completar la caja personalizada de ${shortSizeLabel(size)}`;
      el.className = "custom-progress warn";
    }
  }

  function handleAddCustom(size){
    const select = document.getElementById(`customselect-${size}`);
    const qtyPicker = document.getElementById(`customqtypicker-${size}`);
    const id = select.value;
    if(!id) return;
    const want = parseInt(qtyPicker.value, 10);
    if(isNaN(want) || want <= 0) return;
    const p = PRODUCTS.find(x => x.id === id);
    if(!p) return;

    const maxAllowed = maxCustomAllowed(p);
    const current = customBoxData[id] || 0;
    const finalQty = Math.min(current + want, maxAllowed);
    if(finalQty > 0) customBoxData[id] = finalQty;

    select.value = "";
    qtyPicker.value = 1;

    renderCustomList(size);
    updateCustomProgress(size);
    applyStockToRow(p);
    recalc();
  }

  function renderCustomBoxSection(container, sizesPresent, num){
    if(sizesPresent.length === 0) return;
    const section = document.createElement("section");
    const numStr = String(num).padStart(2, "0");

    const widgetsHtml = sizesPresent.map(size => {
      const productsOfSize = PRODUCTS.filter(p => p.size === size);
      const options = productsOfSize.map(p => `<option value="${p.id}">${p.name} ${fmt(p.price)}</option>`).join("");
      return `
        <div class="custom-box-widget">
          <h3 class="custom-box-title">Caja personalizada — ${shortSizeLabel(size)}</h3>
          <div class="custom-box-form">
            <select class="custom-select" id="customselect-${size}">
              <option value="">Elegí un sabor…</option>
              ${options}
            </select>
            <input type="number" min="1" value="1" class="custom-qty-picker" id="customqtypicker-${size}">
            <button type="button" class="custom-add-btn" id="customadd-${size}">Agregar</button>
          </div>
          <div class="custom-item-list" id="customlist-${size}"></div>
          <p class="custom-progress" id="customprogress-${size}"></p>
        </div>
      `;
    }).join("");

    section.innerHTML = `
      <h2 class="section-title"><span class="num">${numStr}</span> Armá tu caja personalizada</h2>
      <div class="rule"></div>
      <p class="custom-box-help">Elegí distintos sabores para completar cajas de ${UNITS_PER_BOX} botellas. Podés combinar los que quieras, siempre que el total sea múltiplo de ${UNITS_PER_BOX}.</p>
      ${widgetsHtml}
    `;
    container.appendChild(section);

    sizesPresent.forEach(size => {
      document.getElementById(`customadd-${size}`).addEventListener("click", () => handleAddCustom(size));

      const listEl = document.getElementById(`customlist-${size}`);
      listEl.addEventListener("click", e => {
        const btn = e.target.closest(".qty-btn");
        if(!btn) return;
        const id = btn.dataset.id;
        const p = PRODUCTS.find(x => x.id === id);
        if(!p) return;
        let v = customBoxData[id] || 0;
        v = btn.dataset.action === "plus" ? v + 1 : v - 1;
        v = Math.min(Math.max(0, v), maxCustomAllowed(p));
        if(v <= 0) delete customBoxData[id]; else customBoxData[id] = v;
        renderCustomList(size);
        updateCustomProgress(size);
        applyStockToRow(p);
        recalc();
      });

      listEl.addEventListener("input", e => {
        if(!e.target.classList.contains("custom-qty-input-row")) return;
        const id = e.target.dataset.id;
        const p = PRODUCTS.find(x => x.id === id);
        if(!p) return;
        let v = parseInt(e.target.value, 10);
        if(isNaN(v) || v < 0) v = 0;
        v = Math.min(v, maxCustomAllowed(p));
        if(v <= 0) delete customBoxData[id]; else customBoxData[id] = v;
        e.target.value = v;
        updateCustomProgress(size);
        applyStockToRow(p);
        recalc();
      });

      renderCustomList(size);
      updateCustomProgress(size);
    });
  }

  function renderCatalog(){
    const container = document.getElementById("products-container");
    container.innerHTML = "";

    if(PRODUCTS.length === 0){
      container.innerHTML = `<p style="text-align:center; color:var(--ink-soft); padding:20px 0;">No hay productos cargados todavía.</p>`;
      return;
    }

    let sectionNum = 2; // la sección 01 es "Tus datos"

    // 1. Cajas de sabor único (500ml, 1L), en ese orden
    BOXABLE_SIZES.forEach(size => {
      const group = PRODUCTS_BY_SIZE.find(g => g.size === size);
      if(group) renderProductSection(group, sectionNum++, container, true);
    });

    // 2. Caja personalizada (solo para los tamaños que existan en el catálogo)
    const boxableSizesPresent = BOXABLE_SIZES.filter(size => PRODUCTS_BY_SIZE.some(g => g.size === size));
    if(boxableSizesPresent.length > 0){
      renderCustomBoxSection(container, boxableSizesPresent, sectionNum++);
    }

    // 3. El resto (Latas y cualquier otro tamaño), como venta por unidad, igual que antes
    PRODUCTS_BY_SIZE.forEach(group => {
      if(BOXABLE_SIZES.includes(group.size)) return; // ya renderizado arriba
      renderProductSection(group, sectionNum++, container, false);
    });

    PRODUCTS.forEach(applyStockToRow);
    recalc();
  }

  function groupBySize(products){
    const groups = {};
    products.forEach(p => {
      const key = p.size || "Otros";
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    const orderedKeys = [
      ...SIZE_ORDER.filter(k => groups[k]),
      ...Object.keys(groups).filter(k => !SIZE_ORDER.includes(k)),
    ];
    return orderedKeys.map(key => ({ size: key, items: groups[key] }));
  }

  async function loadCatalog(){
    try{
      const sep = CATALOG_SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(CATALOG_SHEET_CSV_URL + sep + "t=" + Date.now());
      const text = await res.text();
      const objs = rowsToObjects(parseCSV(text));

      PRODUCTS = objs
        .filter(o => o.id && (o.activo || "").toLowerCase() !== "no")
        .map(o => {
          const stockVal = parseInt(o.stock, 10);
          return {
            id: o.id,
            name: o.nombre,
            style: o.estilo || "",
            size: o["tamaño"] || o["tamano"] || "Otros",
            price: parsePrice(o.precio),
            stock: isNaN(stockVal) ? undefined : stockVal,
          };
        });

      PRODUCTS_BY_SIZE = groupBySize(PRODUCTS);
      renderCatalog();
    }catch(err){
      const container = document.getElementById("products-container");
      container.innerHTML = `<p style="text-align:center; color:var(--copper-dark); padding:20px 0;">No se pudo cargar el catálogo. Revisá tu conexión y recargá la página.</p>`;
      console.warn("Error cargando el catálogo desde Google Sheets:", err);
    }
  }

  loadCatalog();
  // Vuelve a leer la planilla cada 60 segundos por si un cliente deja la página abierta
  setInterval(loadCatalog, 60000);

  // ============ ENVÍO POR WHATSAPP ============
  // Reemplazá este número por el WhatsApp de tu local (código de país + número, sin +, sin espacios)
  const STORE_WHATSAPP = "5491131967575";

  function showToast(type, text){
    document.getElementById("order-toast-text").textContent = text;
    document.getElementById("order-toast-box").classList.toggle("error", type === "error");
    document.getElementById("order-toast").classList.add("show");
  }
  document.getElementById("order-toast-close").addEventListener("click", () => {
    document.getElementById("order-toast").classList.remove("show");
  });

  document.getElementById("send-btn").addEventListener("click", () => {
    const nombre = document.getElementById("f-nombre").value.trim();
    const telefono = document.getElementById("f-telefono").value.trim();

    const faltanDatos = !nombre || !telefono;

    // Cajas de sabor único (y productos por unidad, como las latas)
    const groupsWithItems = PRODUCTS_BY_SIZE.map(g => ({
      size: g.size,
      boxable: isBoxable(g.size),
      items: g.items.map(p => ({ ...p, qty: getQty(p.id) })).filter(p => p.qty > 0),
    })).filter(g => g.items.length > 0);

    // Caja personalizada, por tamaño
    const customGroups = BOXABLE_SIZES.map(size => ({
      size,
      items: PRODUCTS.filter(p => p.size === size && (customBoxData[p.id] || 0) > 0)
        .map(p => ({ ...p, qty: customBoxData[p.id] })),
    })).filter(g => g.items.length > 0);

    if(faltanDatos || (groupsWithItems.length === 0 && customGroups.length === 0)){
      showToast("error", faltanDatos
        ? "Completá tu nombre y teléfono para continuar."
        : "Elegí al menos un producto para enviar el pedido.");
      return;
    }

    const total = recalc();

    let msg = `*Nuevo pedido — Bierlife*\n\n`;
    msg += `*Nombre:* ${nombre}\n`;
    msg += `*Teléfono:* ${telefono}\n\n`;

    groupsWithItems.forEach(g => {
      msg += `*${SIZE_LABELS[g.size] || g.size}*\n`;
      g.items.forEach(p => {
        if(g.boxable){
          msg += `• ${p.name} x${p.qty} caja(s) de ${UNITS_PER_BOX} — ${fmt(p.qty * p.price * UNITS_PER_BOX)}\n`;
        } else {
          msg += `• ${p.name} x${p.qty} — ${fmt(p.qty * p.price)}\n`;
        }
      });
      msg += `\n`;
    });

    customGroups.forEach(g => {
      const totalBotellas = g.items.reduce((s, p) => s + p.qty, 0);
      msg += `*Caja personalizada — ${shortSizeLabel(g.size)}* (${totalBotellas} botellas)\n`;
      g.items.forEach(p => {
        msg += `• ${p.name} x${p.qty} — ${fmt(p.qty * p.price)}\n`;
      });
      msg += `\n`;
    });

    msg += `*Total: ${fmt(total)}*`;

    // Ítems planos para el historial y descuento de stock, siempre en unidades de botella
    const logItems = [];
    groupsWithItems.forEach(g => {
      g.items.forEach(p => {
        const bottles = g.boxable ? p.qty * UNITS_PER_BOX : p.qty;
        logItems.push({ id: p.id, name: p.name, size: g.size, qty: bottles, price: p.price });
      });
    });
    customGroups.forEach(g => {
      g.items.forEach(p => {
        logItems.push({ id: p.id, name: p.name, size: `${g.size} (personalizada)`, qty: p.qty, price: p.price });
      });
    });

    logOrder(nombre, telefono, logItems, total);

    showToast("success", "¡Listo! Te llevamos a WhatsApp con tu pedido armado — confirmá el envío ahí para completarlo.");

    const waUrl = `https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(msg)}`;
    window.open(waUrl, "_blank");

    // Reiniciar el carrito: cajas de sabor único, latas y caja personalizada
    PRODUCTS.forEach(p => {
      const el = document.getElementById(`qty-${p.id}`);
      if(el) el.value = 0;
    });
    Object.keys(customBoxData).forEach(id => delete customBoxData[id]);
    BOXABLE_SIZES.forEach(size => {
      if(document.getElementById(`customlist-${size}`)){
        renderCustomList(size);
        updateCustomProgress(size);
      }
    });
    PRODUCTS.forEach(applyStockToRow);
    recalc();
  });
</script>
